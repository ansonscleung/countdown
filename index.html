<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e21" />
    <meta name="description" content="A Moominland Midwinter countdown — the darkest hour is just before the dawn." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%230a0e21'/%3E%3Crect x='3' y='1' width='2' height='6' fill='%23eef2fb'/%3E%3Crect x='1' y='3' width='6' height='2' fill='%23eef2fb'/%3E%3C/svg%3E" />
    <title>Moominland Midwinter — Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="countdown-shell" aria-labelledby="page-title">
      <canvas id="winter-scene" class="winter-scene" aria-hidden="true"></canvas>

      <section class="countdown-content">
        <p class="eyebrow">MOOMINLAND MIDWINTER <span aria-hidden="true">·</span> <span id="timezone">HKT</span></p>
        <h1 id="page-title">The darkest hour is just before the dawn</h1>
        <div class="countdown-block" aria-label="Countdown to the target time">
          <p id="countdown" class="countdown" role="timer" aria-live="off">--:--:--:--</p>
          <p id="target-label" class="target-label">Until 28 August 2026 · 18:00 HKT</p>
          <p id="live-announcement" class="sr-only" role="status" aria-live="polite"></p>
        </div>
        <p id="dawn-message" class="dawn-message" hidden>The dawn is here.</p>
      </section>

      <aside class="controls" aria-label="Display controls">
        <button id="fullscreen-toggle" type="button">Enter fullscreen</button>
        <button id="motion-toggle" type="button" aria-pressed="false">Motion: on</button>
      </aside>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
